# Barrack on one machine: Postgres, the control plane (serving the web
# client) and a Docker socket proxy, with each thread's sandbox a sibling
# container that the control plane starts on this machine's Docker.
# See docs/deployment.md, "On one machine with Docker Compose".
#
#   pnpm sandbox-image:build        # the sandbox image, barrack-sandbox:dev
#   docker compose up --build --detach
#
# Settings come from a `.env` file beside this one. Required:
# BARRACK_DATABASE_PASSWORD, and for sign-in a Supabase project's URL and
# publishable key (BARRACK_SUPABASE_URL, BARRACK_SUPABASE_PUBLISHABLE_KEY)
# and the email addresses allowed to use this installation
# (BARRACK_ALLOWED_USER_EMAILS); and the key users' own model keys are
# sealed under (BARRACK_MODEL_CREDENTIAL_KEY, from `openssl rand -base64 32`;
# keep a copy, since losing it loses every stored key). The agent's other
# settings are read from it too. Each user adds their own model keys in
# the web client's Settings.
#
# SIGN-IN IS SUPABASE'S. The control plane listens on every interface of its
# container, where development mode's one shared user is refused, so users
# sign in with Supabase Auth (set the project up as docs/deployment.md
# says) and see only their own threads. The port is still published on
# 127.0.0.1 only: to use it from elsewhere, put it behind HTTPS (access
# tokens must not cross a network in the clear) and add that origin to
# BARRACK_ALLOWED_CLIENT_ORIGINS.
#
# DOCKER ACCESS IS HOST ACCESS. Whoever can create containers through the
# Docker API can start one that is privileged or mounts the host's files,
# and so controls this machine as root. The control plane needs to create
# containers, so a flaw in it could be turned into control of the host. The
# socket proxy below narrows what it can ask Docker for to the few calls the
# Docker provider makes (it cannot list, exec into, read the logs of, or
# build anything, nor touch images, volumes or networks), keeps the socket
# itself out of the control plane's container, and refuses every other
# container on the network. It does not inspect what a create asks for, so
# it does not remove that risk. Run this only on a machine you would trust
# the control plane with.
#
# Networks, and so who can reach what:
#   database    Postgres and the control plane. Internal: no other route.
#   docker-api  The socket proxy and the control plane. Internal.
#   sandboxes   The control plane and every sandbox, with internet access.
# A sandbox can reach the control plane (by the name `control-plane`) and
# the internet, but neither Postgres nor the socket proxy, whose networks it
# never joins. Sandboxes can reach each other, as on Docker's default bridge.
#
# ON A CLOUD VM, A SANDBOX CAN READ THE MACHINE'S CREDENTIALS. Nothing here
# stops a sandbox reaching the cloud metadata address, 169.254.169.254,
# which on most clouds hands out the instance's credentials. Block it on the
# host before running agents there: docs/deployment.md, "The cloud
# metadata address", has the rule.

name: barrack

services:
  database:
    image: postgres:17.12-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_USER: barrack
      POSTGRES_DB: barrack
      POSTGRES_PASSWORD: ${BARRACK_DATABASE_PASSWORD:?set BARRACK_DATABASE_PASSWORD (letters and digits) in .env}
    volumes:
      - database-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "barrack", "--dbname", "barrack"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # https://github.com/wollomatic/socket-proxy: a small proxy, from an image
  # with nothing in it but itself, that forwards only the requests matching
  # these patterns (anchored at both ends) and only from `control-plane`.
  docker-api:
    image: wollomatic/socket-proxy:1.13.2@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848
    command:
      - -listenip=0.0.0.0
      - -allowfrom=control-plane
      - -allowhealthcheck
      - -shutdowngracetime=5
      # The docker CLI checks the API version first.
      - -allowHEAD=(/v[0-9.]+)?/_ping
      - -allowGET=(/v[0-9.]+)?/_ping
      # The proxy sees only the path, so it cannot tell a sandbox from any
      # other container by its ID: the rules naming a full ID allow that
      # call on ANY container whose full ID the control plane knows. It
      # cannot list containers, so those are the ones it created, and its
      # own.
      #
      # Inspect a container named as a sandbox, or by its full ID.
      - -allowGET=(/v[0-9.]+)?/containers/(barrack-thread-[A-Za-z0-9_-]+|[0-9a-f]{64})/json
      # Create a container; start and stop one by its full ID.
      # Pulling is not allowed, so the sandbox image must already be on this
      # machine.
      - -allowPOST=(/v[0-9.]+)?/containers/create
      - -allowPOST=(/v[0-9.]+)?/containers/[0-9a-f]{64}/(start|stop)
      # Put the supervisor's secrets into a container by its full ID, before
      # it starts (`docker cp -`, which looks at the destination first).
      - -allowHEAD=(/v[0-9.]+)?/containers/[0-9a-f]{64}/archive
      - -allowPUT=(/v[0-9.]+)?/containers/[0-9a-f]{64}/archive
      # Remove a container by its full ID.
      - -allowDELETE=(/v[0-9.]+)?/containers/[0-9a-f]{64}
    # Root in this container only to open the socket, which belongs to root
    # and the host's docker group, whose number differs between machines.
    # It holds no capabilities and cannot gain any.
    user: "0:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      # Rootless Docker keeps its socket elsewhere; set DOCKER_SOCKET in .env.
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - docker-api
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  control-plane:
    build:
      context: .
      target: control-plane-with-docker-cli
    image: barrack-control-plane:compose
    env_file:
      - path: .env
        required: false
    environment:
      BARRACK_DATABASE_URL: postgres://barrack:${BARRACK_DATABASE_PASSWORD}@database:5432/barrack
      # Postgres is reachable only on the internal `database` network.
      BARRACK_DATABASE_TLS: disable
      BARRACK_SANDBOX_PROVIDER: docker
      BARRACK_DOCKER_IMAGE: ${BARRACK_DOCKER_IMAGE:-barrack-sandbox:dev}
      BARRACK_DOCKER_NETWORK: barrack-sandboxes
      BARRACK_SANDBOX_CONTROL_PLANE_URL: ws://control-plane:8787
      BARRACK_AUTHENTICATION: supabase
      BARRACK_SUPABASE_URL: ${BARRACK_SUPABASE_URL:?set BARRACK_SUPABASE_URL, your Supabase project's https URL, in .env}
      BARRACK_SUPABASE_PUBLISHABLE_KEY: ${BARRACK_SUPABASE_PUBLISHABLE_KEY:?set BARRACK_SUPABASE_PUBLISHABLE_KEY, the project's publishable key, in .env}
      BARRACK_ALLOWED_USER_EMAILS: ${BARRACK_ALLOWED_USER_EMAILS:?set BARRACK_ALLOWED_USER_EMAILS, the email addresses allowed to sign in, in .env}
      BARRACK_MODEL_CREDENTIAL_KEY: ${BARRACK_MODEL_CREDENTIAL_KEY:?set BARRACK_MODEL_CREDENTIAL_KEY, from openssl rand -base64 32, in .env, and keep a copy}
      DOCKER_HOST: tcp://docker-api:2375
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - database
      - docker-api
      - sandboxes
    depends_on:
      database:
        condition: service_healthy
      docker-api:
        condition: service_healthy
    # Time for the graceful shutdown on SIGTERM: closing connections and
    # letting sandbox creations under way finish, which can take a while.
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  database-data:

networks:
  database:
    internal: true
  docker-api:
    internal: true
  sandboxes:
    # A fixed name, because the control plane passes it to `docker container create`.
    name: barrack-sandboxes
    driver_opts:
      # A fixed name for the bridge interface too, so that a host firewall
      # rule can keep sandboxes from the cloud metadata address
      # (docs/deployment.md, "The cloud metadata address").
      com.docker.network.bridge.name: barrack-sandbox
