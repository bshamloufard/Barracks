name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # The control plane's database tests run against this throwaway Postgres,
    # the major version Supabase runs, so that in CI they never skip.
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: barrack
          POSTGRES_PASSWORD: barrack
          POSTGRES_DB: barrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username barrack"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      BARRACK_TEST_DATABASE_URL: postgres://barrack:barrack@127.0.0.1:5432/barrack_test

    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's packageManager field.
      # It must run before setup-node, whose pnpm cache needs pnpm on the PATH.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  # pnpm check skips the tests that run real containers, because they need
  # the sandbox image built from the current sources. This job builds it and
  # runs them: the Docker provider's contract and a thread end to end in a
  # Docker sandbox. GitHub's Ubuntu runners come with Docker.
  docker-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:docker
      - name: Check that no test left a sandbox container behind
        if: always()
        run: test -z "$(docker ps --all --quiet --filter label=barrack.sandbox)"

  # Builds the control plane's production image, both the default and the
  # variant with the Docker CLI, so that the Dockerfile cannot rot, and starts
  # it to check that it serves its health check and the web client and stops
  # cleanly on SIGTERM. Nothing is published and no secret is used.
  control-plane-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the control plane image
        run: docker build --tag barrack-control-plane:ci .

      - name: Build the variant with the Docker CLI
        run: docker build --target control-plane-with-docker-cli --tag barrack-control-plane:ci-docker-cli .

      - name: Start the image and check what it serves
        run: |
          docker run --detach --name control-plane --publish 127.0.0.1:8787:8787 \
            --env BARRACK_SANDBOX_PROVIDER=fake --env BARRACK_AGENT_HARNESS=fake \
            --env BARRACK_SANDBOX_CONTROL_PLANE_URL=ws://127.0.0.1:8787 \
            barrack-control-plane:ci
          for attempt in $(seq 30); do
            curl --fail --silent http://127.0.0.1:8787/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/health
          curl --fail --silent http://127.0.0.1:8787/ | grep --quiet "<title>Barrack</title>"

      - name: Check that it shuts down cleanly on SIGTERM
        run: |
          docker stop -t 30 control-plane
          docker logs control-plane | grep --quiet "Shut down cleanly"
          test "$(docker inspect control-plane --format '{{.State.ExitCode}}')" = 0

      - name: Check that the variant can run the Docker CLI
        run: docker run --rm --entrypoint docker barrack-control-plane:ci-docker-cli --version

      - name: Check compose.yaml
        run: docker compose config --quiet
        env:
          BARRACK_DATABASE_PASSWORD: checked-in-ci
